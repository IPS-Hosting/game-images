# Counter-Strike 2 — new game, derived from the Pelican egg (games-steamcmd counter_strike_2).
# STATUS: boot-tested (2026-11-28, game2)
#
# Replaces the discontinued CS:GO game (no production data); existing CS:GO servers move over by
# switching the game.
apiVersion: 1

short: cs2
name: Counter-Strike 2
steamAppId: 730
tags: [action, fps, multiplayer, pvp, tactical]

sources:
  - kind: egg
    ref: pelican-eggs/games-steamcmd@0547150ac32eceac7a1aefb2353aae36b5d2f321:counter_strike/counter_strike_2/egg-counter--strike2.yaml
    license: MIT

run:
  image: ghcr.io/parkervcp/steamcmd:sniper@sha256:99d436be50b2c57e94e922597adca0f327a8fcc29204520be929c26efb1f4810
  dataPath: /home/container
  env:
    LD_LIBRARY_PATH: /home/container/game/bin/linuxsteamrt64
  exec:
    - ./game/bin/linuxsteamrt64/cs2
    - -dedicated
    - -ip
    - 0.0.0.0
    - -port
    - '{{ (.Port "game").Container }}'
    - -tv_port
    - '{{ (.Port "tv").Container }}'
    - -maxplayers
    - '{{ .Setting "maxPlayers" }}'
    - arg: -insecure
      when: { setting: vac, truthy: false }
    - arg: -usercon
      when: { setting: rconPassword, notEquals: '' }
    - +game_type
    - '{{ .Setting "gameType" }}'
    - +game_mode
    - '{{ .Setting "gameMode" }}'
    - +map
    - '{{ .Setting "map" }}'
    - +hostname
    - '{{ .Setting "name" }}'
    - arg: +sv_password
      value: '{{ .Setting "password" }}'
    - arg: +rcon_password
      value: '{{ .Setting "rconPassword" }}'
    - arg: +sv_setsteamaccount
      value: '{{ .Setting "gslt" }}'
  console:
    via: stdin
  stop:
    via: command
    command: quit
    timeoutSeconds: 15
  ready:
    pattern: 'Connection to Steam servers successful'

install:
  - kind: steamcmd
    appId: 730
  # Steamworks SDK redistributable: steamSdk links its steamclient.so to ~/.steam/sdk64, where the
  # server loads it (app 730 does not ship one).
  - kind: steamcmd
    appId: 1007
    dir: steamworks
    steamSdk: true

query:
  protocol: a2s
  port: game

ports:
  - { identifier: game, protocol: UDP, default: 27015, group: 0 }
  - { identifier: rcon, protocol: TCP, default: 27015, group: 0 }
  - { identifier: tv,   protocol: UDP, default: 27020, group: 1 }

settings:
  - key: name
    name: { de: Servername, en: Server name }
    type: STRING
    default: Mein CS2 Server
    validation: { required: true, minLength: 3, maxLength: 64 }
  - key: password
    name: { de: Server-Passwort, en: Server password }
    description: Leer lassen für einen öffentlichen Server.
    type: HIDDENSTRING
    validation: { maxLength: 64 }
  - key: maxPlayers
    name: { de: Maximale Spieler, en: Max players }
    type: NUMBER
    default: '12'
    validation: { integer: true, min: 2, max: 64 }
  - key: gslt
    name: Game Server Login Token
    description: Ohne Token ist der Server nur über die lokale Verbindung erreichbar. Token erstellen unter https://steamcommunity.com/dev/managegameservers (App-ID 730).
    type: HIDDENSTRING
    validation: { maxLength: 64 }
  - key: vac
    name: { de: VAC aktiviert, en: VAC enabled }
    type: BOOLEAN
    default: '1'
  - key: map
    name: { de: Startkarte, en: Start map }
    type: STRINGENUM
    default: de_dust2
    category: gameplay
    values:
      - { value: de_dust2 }
      - { value: de_mirage }
      - { value: de_inferno }
      - { value: de_nuke }
      - { value: de_overpass }
      - { value: de_ancient }
      - { value: de_anubis }
      - { value: de_vertigo }
      - { value: cs_office }
      - { value: cs_italy }
  - key: gameType
    name: { de: Spieltyp, en: Game type }
    type: NUMBERENUM
    default: '0'
    category: gameplay
    values:
      - { value: '0', label: Klassisch }
      - { value: '1', label: Waffenspiele }
      - { value: '3', label: Benutzerdefiniert }
  - key: gameMode
    name: { de: Spielmodus, en: Game mode }
    description: 'Klassisch: 0 = Casual, 1 = Competitive, 2 = Wingman. Waffenspiele: 0 = Arms Race, 2 = Deathmatch.'
    type: NUMBERENUM
    default: '1'
    category: gameplay
    values:
      - { value: '0', label: Casual / Arms Race }
      - { value: '1', label: Competitive }
      - { value: '2', label: Wingman / Deathmatch }
  - key: rconPassword
    name: { de: RCON-Passwort, en: RCON password }
    description: Leer lassen, um RCON zu deaktivieren.
    type: HIDDENSTRING
    validation: { maxLength: 64 }
    category: admin

preconditions:
  - check: { setting: gslt, notEquals: '' }
    severity: warning
    message: Ohne Game Server Login Token erscheint der Server nicht in der Serverliste und Spieler können nur per IP beitreten.

protectedFiles:
  - { path: /game/bin/**, readOnly: true }

backupIgnore:
  - game/bin/**
  - game/core/*.vpk
  - game/csgo/*.vpk
  - steamapps/**
  - steamworks/**

requirements:
  minCpuThreads: 2
  minRam: 4096
  minDiskspace: 60
