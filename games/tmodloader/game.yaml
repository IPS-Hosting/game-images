# tModLoader — new game (Terraria mod loader, MIT), based on the Pelican egg.
# STATUS: boot-tested (2026-11-27, game2)
#
# steamcmd app 1281930 is not available to anonymous logins (the install finishes without
# files), so the server is the pinned tModLoader.zip from the GitHub releases. Updates are a
# reviewed version bump of the install stage (url, checksum).
apiVersion: 1

short: tmodloader
name: tModLoader
steamAppId: 1281930
tags: [adventure, sandbox, survival, moddable, co-op, crafting]

sources:
  - kind: egg
    ref: pelican-eggs/games-standalone@0fb3f0c760a4e237593abd9a25bee6225b9f698f:terraria/tmodloader/egg-t-modloader.json
    license: MIT

run:
  image: ghcr.io/pelican-eggs/yolks:dotnet_8@sha256:81874feb2d5d16a2fcdb2041bb4d276ab61982a86f05b17be1c9d047e2ea9d41
  dataPath: /home/container
  workingDir: server
  # No tmpfs at /tmp: MonoMod (tML startup) writes mm-exhelper.so to /tmp and loads it; the
  # private tmp directory (bind mount, like production) is enough.
  env:
    DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  exec:
    - dotnet
    - tModLoader.dll
    - -server
    - -config
    - /home/container/serverconfig.txt
    - -savedirectory
    - /home/container
    - -tmlsavedirectory
    - /home/container/saves
    - -modpath
    - /home/container/mods
  console:
    via: stdin
  stop:
    via: command
    command: exit          # saves the world, then quits
    timeoutSeconds: 90
  ready:
    pattern: "Type 'help' for a list of commands"

install:
  # tModLoader v2026.09.3.1 (.NET 8)
  - kind: download
    url: https://github.com/tModLoader/tModLoader/releases/download/v2026.09.3.1/tModLoader.zip
    checksum: sha256:5aaed81b245044286c3ade200f8bac9162ef932ee8ff11a31e05da49a186c07b
    dest: server
    extract: { format: zip }

hooks:
  postInstall:
    - ensureDir: { path: saves/Worlds }
    - ensureDir: { path: mods }

players:
  joinPattern: '^(?P<name>.+) has joined\.$'
  leavePattern: '^(?P<name>.+) has left\.$'

ports:
  - { identifier: game, protocol: TCP, default: 7777, group: 0 }

settings:
  - key: worldName
    name: { de: Weltname, en: World name }
    description:
      de: Dateiname der Welt in saves/Worlds. Ein neuer Name erzeugt beim Start eine neue Welt.
      en: File name of the world in saves/Worlds. A new name creates a new world at start.
    type: STRING
    default: world
    validation: { required: true, minLength: 1, maxLength: 64, pattern: '[A-Za-z0-9 _.-]+' }
    category: world
  - key: worldSize
    name: { de: Weltgröße, en: World size }
    description:
      de: Nur beim Erzeugen einer neuen Welt verwendet.
      en: Used only when a new world is created.
    type: NUMBERENUM
    default: '2'
    values:
      - { value: '1', label: { de: Klein, en: Small } }
      - { value: '2', label: { de: Mittel, en: Medium } }
      - { value: '3', label: { de: Groß, en: Large } }
    category: world
  - key: difficulty
    name: { de: Schwierigkeit, en: Difficulty }
    description:
      de: Nur beim Erzeugen einer neuen Welt verwendet.
      en: Used only when a new world is created.
    type: NUMBERENUM
    default: '0'
    values:
      - { value: '0', label: { de: Klassisch, en: Classic } }
      - { value: '1', label: { de: Experte, en: Expert } }
      - { value: '2', label: { de: Meister, en: Master } }
      - { value: '3', label: { de: Reise, en: Journey } }
    category: world
  - key: seed
    name: { de: Seed, en: Seed }
    description:
      de: Nur beim Erzeugen einer neuen Welt verwendet. Leer = zufällig.
      en: Used only when a new world is created. Empty means random.
    type: STRING
    validation: { maxLength: 64 }
    category: world
  - key: maxPlayers
    name: { de: Maximale Spieler, en: Max players }
    type: NUMBER
    default: '8'
    validation: { required: true, integer: true, min: 1, max: 255 }
  - key: password
    name: { de: Server-Passwort, en: Server password }
    description:
      de: Leer = kein Passwort.
      en: Empty means no password.
    type: HIDDENSTRING
    validation: { maxLength: 64 }
  - key: motd
    name: { de: Begrüßungsnachricht, en: Message of the day }
    type: STRING
    default: Willkommen!
    validation: { maxLength: 128 }
  - key: secure
    name: { de: Cheat-Schutz, en: Cheat protection }
    type: BOOLEAN
    default: '0'
    category: admin
  - key: npcStream
    name: { de: NPC-Stream, en: NPC stream }
    description:
      de: Reduziert das Ruckeln von Gegnern. 0 = aus, Standard 60.
      en: Reduces enemy skipping. 0 disables it, default 60.
    type: NUMBER
    default: '60'
    validation: { required: true, integer: true, min: 0, max: 60 }
    category: performance

config:
  # Outside server/, so the copy shipped in tModLoader.zip never overwrites it.
  - path: serverconfig.txt
    format: kv
    values:
      worldpath: /home/container/saves/Worlds
      world: '/home/container/saves/Worlds/{{ .Setting "worldName" }}.wld'
      worldname: '{{ .Setting "worldName" }}'
      autocreate: '{{ .Setting "worldSize" }}'
      difficulty: '{{ .Setting "difficulty" }}'
      seed: '{{ .Setting "seed" }}'
      maxplayers: '{{ .Setting "maxPlayers" }}'
      port: '{{ (.Port "game").Container }}'
      password: '{{ .Setting "password" }}'
      motd: '{{ .Setting "motd" }}'
      secure: '{{ .SettingBool "secure" | boolInt }}'
      npcstream: '{{ .Setting "npcStream" }}'
      upnp: '0'

protectedFiles:
  - { path: /server/**, readOnly: true }

backupIgnore:
  - server/**

requirements:
  minCpuThreads: 2
  minRam: 2048
  minDiskspace: 3
