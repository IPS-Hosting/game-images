name: "Lint game manifests"

on:
  pull_request:
    paths:
      - "**/game.yaml"
      - "schema/**"
      - ".github/workflows/lint-manifests.yml"

  push:
    branches:
      - main
    paths:
      - "**/game.yaml"
      - "schema/**"
      - ".github/workflows/lint-manifests.yml"

jobs:
  lint:
    name: Validate game.yaml manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --prefix schema

      - name: Lint manifests
        run: node schema/lint.mjs
